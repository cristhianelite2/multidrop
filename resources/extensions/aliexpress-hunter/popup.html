<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Multidrop Hunter</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; width: 340px; color: #134e4a; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    h2 { font-size: 12px; margin: 12px 0 6px; font-weight: 700; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #99f6e4; border-radius: 8px; background: #fff; }
    button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #0f766e; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #115e59; margin-top: 6px; }
    button.linkish { background: transparent; color: #0f766e; margin-top: 4px; padding: 4px; font-weight: 500; text-decoration: underline; width: auto; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.2em; margin: 8px 0 0; font-size: 12px; color: #0f766e; }
    #status.is-error { color: #b91c1c; }
    #status.is-ok { color: #0f766e; font-weight: 600; }
    .hint { margin: 6px 0 0; font-size: 11px; color: #5b7c79; }
    .hidden { display: none !important; }
    #store-meta { margin: 4px 0 0; font-size: 11px; color: #5b7c79; }
    #product-found { margin: 10px 0 0; }
    .product-found-card {
      display: flex;
      gap: 10px;
      padding: 10px;
      border: 2px solid #14b8a6;
      border-radius: 10px;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 100%);
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.14);
    }
    .product-found-thumb {
      flex: 0 0 56px;
      width: 56px;
      height: 56px;
      border-radius: 8px;
      overflow: hidden;
      background: #ccfbf1;
      border: 1px solid #5eead4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-found-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .product-found-thumb.no-image img { display: none; }
    .product-found-thumb.no-image::after { content: '📦'; font-size: 24px; line-height: 1; }
    .product-found-body { min-width: 0; flex: 1; }
    .product-found-label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0f766e;
      margin-bottom: 3px;
    }
    .product-found-name {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #134e4a;
      line-height: 1.3;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .product-found-meta {
      display: block;
      font-size: 10px;
      color: #115e59;
      font-weight: 600;
    }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 6px; font-size: 12px; }
    .checks label { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; margin: 0; }
    hr { border: 0; border-top: 1px solid #ccfbf1; margin: 12px 0; }
    .extract-wrap { margin-top: 10px; border: 1px solid #99f6e4; border-radius: 10px; background: #f0fdfa; overflow: hidden; }
    .extract-toggle { width: 100%; margin: 0; padding: 10px 12px; border: 0; border-radius: 0; background: transparent; color: #134e4a; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .extract-toggle:hover { background: #ccfbf1; }
    .extract-toggle .chev { font-size: 10px; color: #0f766e; transition: transform .15s ease; }
    .extract-wrap.is-open .extract-toggle .chev { transform: rotate(90deg); }
    .extract-summary { font-size: 10px; font-weight: 500; color: #5b7c79; margin-top: 2px; }
    .extract-panel { display: none; padding: 0 12px 12px; border-top: 1px solid #ccfbf1; }
    .extract-wrap.is-open .extract-panel { display: block; }
    .extract-panel .hint { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Multidrop · Hunter</h1>

  <div id="setup-block">
    <label for="origin">URL de Multidrop</label>
    <input id="origin" placeholder="https://shop.ceballosleon.com" autocomplete="off">
    <div id="token-wrap">
      <label for="token">Token del plugin</label>
      <input id="token" placeholder="pégalo desde Product Hunter" autocomplete="off">
    </div>
    <button type="button" id="save">Guardar y validar</button>
  </div>

  <div id="ready-block" class="hidden">
    <p class="hint" id="origin-label"></p>
    <label for="store">Tienda</label>
    <select id="store"></select>
    <p id="store-meta"></p>

    <button type="button" id="capture" class="secondary">Capturar ficha → borrador</button>

    <div id="extract-wrap" class="extract-wrap">
      <button type="button" id="extract-toggle" class="extract-toggle" aria-expanded="false" aria-controls="extract-panel">
        <span>
          Extraer al producto
          <span id="extract-summary" class="extract-summary">Comprimido · pulsa para expandir</span>
        </span>
        <span class="chev" aria-hidden="true">▶</span>
      </button>
      <div id="extract-panel" class="extract-panel">
        <p class="hint">Abre una ficha AliExpress o CJ, busca el SKU en Multidrop y elige qué importar. También: clic derecho en una imagen → <strong>Extraer imagen a Multidrop</strong>.</p>
        <label for="product-sku">SKU del producto en Multidrop</label>
        <div style="display:flex;gap:6px;align-items:flex-end;">
          <input id="product-sku" placeholder="SKU o ID" autocomplete="off" style="flex:1">
          <button type="button" id="search-sku" class="secondary" style="width:auto;margin-top:0;padding:6px 10px;">Buscar</button>
        </div>
        <div id="product-found" class="hidden"></div>
        <div class="checks">
          <label><input type="checkbox" class="ext-section" value="images" checked> Imágenes</label>
          <label><input type="checkbox" class="ext-section" value="videos" checked> Videos</label>
          <label><input type="checkbox" class="ext-section" value="reviews" checked> Reseñas</label>
          <label><input type="checkbox" class="ext-section" value="description" checked> Descripción</label>
          <label><input type="checkbox" class="ext-section" value="details"> Detalles</label>
        </div>
        <label class="checks"><input type="checkbox" id="extract-replace"> Reemplazar secciones marcadas</label>
        <button type="button" id="extract" class="secondary">Extraer de esta página</button>
      </div>
    </div>

    <button type="button" id="change-token" class="linkish">Cambiar token</button>
  </div>

  <p id="status"></p>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
